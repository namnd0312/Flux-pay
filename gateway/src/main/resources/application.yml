spring:
  application:
    name: flux-pay-gateway
  http:
    client:
      # Global client timeouts; the provider adapter inherits these (no per-adapter factory override).
      connect-timeout: 2s
      read-timeout: 5s
  profiles:
    # Local runs use "dev" (reads the root .env via compose). Tests activate "test".
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flux_pay}
    username: ${DB_USER:flux_pay}
    password: ${DB_PASSWORD:}
  jpa:
    # Keep the persistence context out of the view layer; every query runs inside an explicit transaction.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. validate makes Hibernate fail fast if entities drift from the migrations.
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

fluxpay:
  # AES-256 key (base64, 32 bytes) for merchant secret encryption. No default on purpose:
  # the app must fail to start if it is unset (see SecretCipher). Dev value lives in .env.
  secret-key: ${FLUXPAY_SECRET_KEY:}
  auth:
    # A request whose X-Timestamp is further than this from "now" is rejected (replay bound).
    timestamp-tolerance: 5m
    # Hard cap on the authenticated request body before buffering it for signing (413 over this).
    max-body-bytes: 65536
  idempotency:
    # How long a stored idempotency key is replayable before the sweeper purges it.
    ttl: 24h
    # How long an IN_PROGRESS key holds its lease before another retry may take over (dead worker).
    lease: 60s
  providers:
    # Provider resolved when the request omits one. Adapters register by code (e.g. MOCK).
    default: MOCK
    mock:
      base-url: ${FLUXPAY_PROVIDERS_MOCK_BASE_URL:http://localhost:8081}
      # Shared HMAC key; must equal mock.secret on the mock-provider. Dev default, override in prod.
      webhook-secret: ${FLUXPAY_PROVIDERS_MOCK_WEBHOOK_SECRET:mock-webhook-secret-dev}
  payment:
    # How long a PENDING payment stays payable before the sweeper expires it. Demo/env may override to 1m.
    expiry: 15m
    # CREATED rows older than this are failed by the sweeper (create crashed before PENDING).
    created-timeout: 2m
  scheduling:
    # Master switch for the expiry sweeper. Disabled in the test profile.
    enabled: true
    sweep-interval: 30s
