# Test profile. Datasource comes from the Testcontainers Postgres via @ServiceConnection.
spring:
  datasource:
    hikari:
      # Headroom for ConcurrentCreateIT (50 threads racing the same create).
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

fluxpay:
  # Dev-only AES key, committed so `./mvnw verify` needs no env vars. NEVER reuse in prod.
  # Same key encrypted the DEMO secret in V5, so the startup self-check and auth both pass.
  secret-key: woTutwqDuw6XWQ5m5yWqZcE4nBglcAs9sIHaBw/5tKo=
  providers:
    # CountingFakeProvider registers code MOCK under the test profile (the real adapter is excluded).
    default: MOCK
  payment:
    expiry: 15m
    created-timeout: 2m
  scheduling:
    # Off so the sweeper never fires on its own; tests call the sweep methods directly.
    enabled: false
