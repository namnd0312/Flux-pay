# Test profile. Datasource comes from the Testcontainers Postgres via @ServiceConnection.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

fluxpay:
  providers:
    # CountingFakeProvider registers code MOCK under the test profile (the real adapter is excluded).
    default: MOCK
  payment:
    expiry: 15m
    created-timeout: 2m
  scheduling:
    # Off so the sweeper never fires on its own; tests call the sweep methods directly.
    enabled: false
