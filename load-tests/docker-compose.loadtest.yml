# Override for load-test runs only. Adds a metrics endpoint on a separate management port
# that is published on localhost only; the application ports stay as they are.
#
#   docker compose -f docker-compose.yml -f load-tests/docker-compose.loadtest.yml up -d --build
#
# Actuator endpoints are unauthenticated, so this must never become the default: with the
# management port set, /actuator/* (including health) moves off 8080/8081 onto 9090/9091.
services:
  gateway:
    environment:
      MANAGEMENT_SERVER_PORT: "9090"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
      # Publishes tomcat.threads.* (busy / max request threads).
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
    ports:
      - "127.0.0.1:9090:9090"
  mock-provider:
    environment:
      MANAGEMENT_SERVER_PORT: "9091"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
    ports:
      - "127.0.0.1:9091:9091"
